[project]
name = "aisc-control-objectives"
version = "0.1.0"
description = "A catalogue of EU AI Act control objectives, and where a given system should start"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    # Storage, on the qualification app's blueprint: Postgres, a table per
    # thing, ordered timestamped migrations. SQLAlchemy + Alembic is the
    # Python analogue of its Prisma + prisma/migrations.
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    # The platform's one way to a model: the same framework, version and
    # provider SDKs the qualification filler uses.
    "besser-agentic-framework==4.5.1",
    "openai>=1.55",      # the ten OpenAI-compatible wrappers, Mistral included
    "anthropic>=0.40",   # LLMAnthropic, which uses the native SDK
    "ollama>=0.3",       # LLMOllama, for a model you host yourself
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aisc_control_objectives"]
artifacts = ["src/aisc_control_objectives/data/*.csv", "src/aisc_control_objectives/templates/*", "src/aisc_control_objectives/static/*", "src/aisc_control_objectives/skills/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# The defaults (pyflakes + pycodestyle errors) plus the rules that catch the
# mistakes a bulk rename makes: unused imports and names, undefined names,
# import order, and comprehension/bugbear slips.
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = [
    "E501",  # line length is handled by the formatter, not enforced in review
    "B008",  # FastAPI's Depends() in defaults is the framework's own idiom
    "UP047", # explicit TypeVars are kept on purpose; PEP 695 syntax is not a goal here
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
