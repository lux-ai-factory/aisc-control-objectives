[project]
name = "wizard"
version = "0.1.0"
description = "Wizard — serves the AI Act control objectives for an AI system assessment"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    # The platform's one way to a model: the same framework, version and
    # provider SDKs the qualification filler uses.
    "besser-agentic-framework==4.5.1",
    "openai>=1.55",      # the ten OpenAI-compatible wrappers, Mistral included
    "anthropic>=0.40",   # LLMAnthropic, which uses the native SDK
    "ollama>=0.3",       # LLMOllama, for a model you host yourself
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wizard"]
artifacts = ["src/wizard/data/*.csv", "src/wizard/templates/*", "src/wizard/static/*", "src/wizard/skills/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
