# Migrations, the way the qualification app does them with Prisma: ordered,
# timestamped, one file each, applied before the service starts.
[alembic]
script_location = alembic
prepend_sys_path = src
# split prepend_sys_path on the OS separator, as Alembic 1.16 asks (no more spaces, commas, colons)
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
